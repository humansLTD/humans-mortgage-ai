<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מפקח משכנתא — משכנתא חכמה</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <div class="shell" id="shell">
        <main class="content">
            <div class="head-row page-head">
                <div>
                    <h1>מפקח משכנתא</h1>
                    <p>עקוב אחר המשכנתא שלך וקבל ניתוח AI</p>
                </div>
                <button class="btn btn-navy" id="add-btn" type="button">+ הוספת משכנתא</button>
            </div>

            <section id="adder" class="hidden">
                <div class="drop" id="drop">
                    <input id="file" type="file" accept=".pdf,image/*">
                    <strong>העלו דוח יתרות לסילוק (PDF)</strong>
                    <p class="muted">המערכת תחלץ מסלולים, ריביות ויתרות מהטקסט בדוח. אפשר לתקן לפני שמירה.</p>
                </div>
                <p class="parse-note" id="status"></p>
                <form class="panel" id="review"></form>
            </section>

            <div id="list"></div>
        </main>
    </div>
    <script src="/js/habona.js"></script>
    <script src="/js/shell.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        mountShell("watch");
        const db = Habona.loadDb();
        const adder = document.getElementById("adder");
        const review = document.getElementById("review");
        const status = document.getElementById("status");
        let draft = null;

        function renderList() {
            const list = document.getElementById("list");
            if (!db.mortgages.length) {
                list.innerHTML = `<div class="panel"><p>אין עדיין משכנתאות. לחצו על הוספת משכנתא והעלו דוח יתרות.</p></div>`;
                return;
            }
            list.innerHTML = db.mortgages.map((m) => {
                const t = Habona.totals(m);
                return `<a class="loan-card" href="/mortgage.html?id=${m.id}">
                    <div>
                        <strong>${m.bank}</strong>
                        <div class="muted">${m.startDate || ""} · ${t.trackCount} מסלולים</div>
                        <div class="bar"><span style="width:${t.paidRatio}%"></span></div>
                        <div class="muted">הוחזר עד כה ${t.paidRatio}%</div>
                    </div>
                    <div style="text-align:left">
                        <div class="muted">יתרה</div>
                        <strong>${Habona.money(t.remaining)}</strong>
                        <div class="muted">תשלום חודשי ${Habona.money(t.payment)}</div>
                    </div>
                </a>`;
            }).join("");
        }

        function trackFields(track, i) {
            return `
              <div class="panel" style="margin-top:10px">
                <div class="form-row">
                    <div><label>שם מסלול</label><input name="t_name_${i}" value="${track.name || ""}"></div>
                    <div><label>ריבית %</label><input name="t_rate_${i}" type="number" step="0.01" value="${track.annualRate || 0}"></div>
                </div>
                <div class="form-row">
                    <div><label>סכום מקורי</label><input name="t_orig_${i}" type="number" value="${track.originalPrincipal || 0}"></div>
                    <div><label>יתרה נוכחית</label><input name="t_left_${i}" type="number" value="${track.principal || 0}"></div>
                </div>
                <div class="form-row">
                    <div><label>החזר חודשי</label><input name="t_pay_${i}" type="number" value="${track.payment || 0}"></div>
                    <div><label>שנים</label><input name="t_years_${i}" type="number" value="${track.years || 15}"></div>
                </div>
              </div>`;
        }

        function showReview(parsed) {
            draft = parsed;
            const tracks = parsed.tracks.length ? parsed.tracks : [{ name: "מסלול 1", annualRate: 0, originalPrincipal: 0, principal: 0, payment: 0, years: 15 }];
            parsed.tracks = tracks;
            review.innerHTML = `
                <p class="parse-note">בדקו שהמספרים מהדוח נכונים ואז שמרו. אם שדה חסר — השלימו ידנית.</p>
                <div class="form-row">
                    <div><label>בנק</label><input name="bank" value="${parsed.bank || ""}"></div>
                    <div><label>תאריך התחלה</label><input name="startDate" value="${parsed.startDate || ""}"></div>
                </div>
                <div class="form-row">
                    <div><label>תקופה כוללת (שנים)</label><input name="years" type="number" value="${parsed.years || 30}"></div>
                </div>
                ${tracks.map(trackFields).join("")}
                <div style="margin-top:14px"><button class="btn btn-navy" type="submit">שמירת משכנתא</button></div>
            `;
        }

        document.getElementById("add-btn").onclick = () => adder.classList.toggle("hidden");
        document.getElementById("drop").onclick = () => document.getElementById("file").click();
        document.getElementById("file").onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            status.textContent = "קורא את הדוח...";
            try {
                let text = "";
                if (file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf")) {
                    text = await Habona.extractPdfText(file);
                } else {
                    text = file.name;
                }
                const parsed = Habona.parseReportText(text);
                parsed.fileName = file.name;
                if (!parsed.tracks.length) {
                    status.textContent = "נמצא קובץ, אבל לא זוהו מסלולים אוטומטית. מלאו ידנית לפי הדוח.";
                } else {
                    status.textContent = `חולצו ${parsed.tracks.length} מסלולים מתוך ${file.name}. אשרו לפני שמירה.`;
                }
                showReview(parsed);
            } catch (err) {
                status.textContent = "לא הצלחנו לקרוא PDF. מלאו את הפרטים ידנית.";
                showReview({ bank: "", startDate: "", years: 30, tracks: [] });
            }
        };

        review.addEventListener("submit", (e) => {
            e.preventDefault();
            const data = new FormData(review);
            const tracks = [];
            for (let i = 0; i < 8; i += 1) {
                const name = data.get("t_name_" + i);
                if (!name) continue;
                const years = Number(data.get("t_years_" + i) || 15);
                const meta = Habona.detectKind(String(name));
                tracks.push({
                    id: Habona.uid(),
                    name,
                    kind: meta.kind,
                    cpiLinked: meta.cpi,
                    annualRate: Number(data.get("t_rate_" + i) || 0),
                    originalPrincipal: Number(data.get("t_orig_" + i) || 0),
                    principal: Number(data.get("t_left_" + i) || 0),
                    payment: Number(data.get("t_pay_" + i) || 0),
                    years,
                    monthsTotal: years * 12,
                    monthsElapsed: 0,
                    resetEveryMonths: meta.kind.startsWith("variable") ? 24 : null,
                    nextResetDate: meta.kind.startsWith("variable") ? Habona.addMonths(Habona.MARKET.asOf, 24) : null,
                });
            }
            db.mortgages.push({
                id: Habona.uid(),
                bank: data.get("bank"),
                startDate: data.get("startDate"),
                years: Number(data.get("years") || 30),
                tracks,
            });
            Habona.saveDb(db);
            location.href = "/supervise.html";
        });

        renderList();
    </script>
</body>
</html>
