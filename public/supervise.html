<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פיקוח משכנתא — משכנתא חכמה</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="/app.html"><span class="brand-mark">מ</span> משכנתא חכמה</a>
            <a class="btn btn-ghost" href="/app.html">חזרה</a>
        </div>
    </header>
    <main class="page">
        <div class="wrap">
            <h1>פיקוח על המשכנתא</h1>
            <p class="lede">העלו דוח יתרות לסילוק. המערכת מציגה מסלולים, מורידה קרן וריבית כל חודש, ומעדכנת עוגן רק ביום העדכון החוזי. פריים מתעדכן כשריבית בנק ישראל משתנה.</p>

            <section class="card" id="upload-card">
                <div class="drop" id="drop">
                    <input id="file" type="file" accept=".pdf,image/*">
                    <p><strong>לחצו להעלאת דוח יתרות לסילוק</strong></p>
                    <p class="meta">PDF, PNG או JPG. בשלב זה הקריאה היא דמו לפי מבנה דוח בנקאי טיפוסי.</p>
                </div>
            </section>

            <section id="board" class="hidden"></section>
        </div>
    </main>
    <script src="/js/habona.js"></script>
    <script>
        Habona.requireAuth();
        let state = JSON.parse(localStorage.getItem("habonaMortgage") || "null");
        let asOf = state?.asOf || Habona.MARKET.asOf;

        const drop = document.getElementById("drop");
        const file = document.getElementById("file");
        drop.addEventListener("click", () => file.click());
        file.addEventListener("change", () => {
            if (!file.files.length) return;
            const report = Habona.demoReport(Habona.MARKET.asOf);
            report.fileName = file.files[0].name;
            state = report;
            asOf = report.reportDate;
            save();
            render();
        });

        function save() {
            localStorage.setItem("habonaMortgage", JSON.stringify({ ...state, asOf }));
        }

        function totals() {
            const tracks = state.tracks.map((track) => {
                const monthsLeft = track.monthsTotal - track.monthsElapsed;
                const payment = Habona.monthlyPayment(track.principal, track.annualRate, monthsLeft);
                return { ...track, payment };
            });
            state.tracks = tracks;
            return Habona.summarize(tracks);
        }

        function resetLabel(track) {
            if (track.kind === "prime") return "מתעדכן עם ריבית הפריים בשוק";
            if (!track.nextResetDate) return "אין עדכון עוגן — ריבית קבועה";
            if (asOf < track.nextResetDate) return `העוגן לא מתעדכן עד ${track.nextResetDate}`;
            return `תאריך עדכון עוגן: ${track.nextResetDate}`;
        }

        function render() {
            if (!state) return;
            document.getElementById("upload-card").classList.add("hidden");
            const sum = totals();
            const board = document.getElementById("board");
            board.classList.remove("hidden");
            board.innerHTML = `
                <div class="kpis">
                    <div class="kpi"><span>יתרת חוב</span><strong>${Habona.money(sum.principal)}</strong></div>
                    <div class="kpi"><span>החזר חודשי</span><strong>${Habona.money(sum.payment)}</strong></div>
                    <div class="kpi"><span>מסלולים</span><strong>${sum.trackCount}</strong></div>
                    <div class="kpi"><span>נכון ליום</span><strong>${asOf}</strong></div>
                </div>
                <div class="card">
                    <p class="meta">שוק לדוגמה (${Habona.MARKET.asOf}): פריים ${Habona.pct(Habona.MARKET.prime)} · בנק ישראל ${Habona.pct(Habona.MARKET.boiRate)} · עוגן לא צמוד ${Habona.pct(Habona.MARKET.anchors.variable_unlinked.rate)}</p>
                    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
                        <button class="btn btn-navy" id="month" type="button">סימולציית חודש הבא</button>
                        <button class="btn btn-beige" id="market" type="button">החלת מצב שוק נוכחי</button>
                    </div>
                </div>
                <div class="tracks">
                    ${state.tracks.map((track) => `
                        <article class="track">
                            <div class="track-head">
                                <strong>${track.name}</strong>
                                <span class="pill ${track.nextResetDate && asOf < track.nextResetDate ? "ok" : "warn"}">${resetLabel(track)}</span>
                            </div>
                            <div class="meta">
                                יתרה ${Habona.money(track.principal)} · ריבית נוכחית ${Habona.pct(track.annualRate)} · החזר ${Habona.money(track.payment || 0)}
                                ${track.lastPrincipalPaid ? `<br>בחודש האחרון: קרן ${Habona.money(track.lastPrincipalPaid)} · ריבית ${Habona.money(track.lastInterest)}` : ""}
                            </div>
                        </article>
                    `).join("")}
                </div>
            `;
            document.getElementById("month").onclick = () => {
                asOf = Habona.addMonths(asOf, 1);
                state.tracks = state.tracks.map((track) => Habona.stepMonth(track, Habona.MARKET, asOf));
                save();
                render();
            };
            document.getElementById("market").onclick = () => {
                state.tracks = state.tracks.map((track) => {
                    if (Habona.shouldResetAnchor(track, asOf)) {
                        if (track.kind === "prime") track.annualRate = Habona.MARKET.prime + (track.spread || 0);
                    }
                    return track;
                });
                save();
                render();
            };
        }

        if (state) render();
    </script>
</body>
</html>
