<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>יועץ תמהיל — משכנתא חכמה</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div class="shell" id="shell">
        <main class="content">
            <div class="page-head">
                <h1>יועץ תמהיל משכנתא</h1>
                <p>שאלון קצר. התמהיל שומר על כללי בנק ישראל.</p>
            </div>
            <form class="panel" id="quiz">
                <div class="progress" id="progress"></div>
                <div class="form-grid" id="fields"></div>
                <div class="step-nav">
                    <button class="btn" type="button" id="back">חזרה</button>
                    <button class="btn btn-navy" type="button" id="next">המשך</button>
                </div>
            </form>
            <section id="result" class="hidden"></section>
        </main>
    </div>
    <script src="/js/habona.js"></script>
    <script src="/js/shell.js"></script>
    <script>
        mountShell("plan");
        const steps = [
            [
                { id: "goal", label: "מה המטרה?", type: "select", options: [["first","דירה ראשונה"],["replace","החלפת דירה"],["refi","מחזור משכנתא קיימת"],["invest","השקעה"]] },
                { id: "age", label: "גיל הלווה הראשי", type: "number" }
            ],
            [
                { id: "propertyValue", label: "שווי הנכס (₪)", type: "number" },
                { id: "equity", label: "הון עצמי (₪)", type: "number" }
            ],
            [
                { id: "years", label: "תקופת משכנתא מועדפת", type: "select", options: [["20","20 שנה"],["25","25 שנה"],["30","30 שנה"]] },
                { id: "stayYears", label: "כמה שנים מתכננים לגור בנכס?", type: "number" }
            ],
            [
                { id: "income", label: "הכנסה נטו של משק הבית (₪ לחודש)", type: "number" },
                { id: "job", label: "יציבות הכנסה", type: "select", options: [["employee","שכיר/ה קבוע"],["self","עצמאי/ת"],["mixed","מעורב"]] }
            ],
            [
                { id: "preference", label: "מה חשוב יותר?", type: "select", options: [["stable","החזר יציב לאורך שנים"],["balance","איזון"],["low_now","החזר נמוך ככל האפשר עכשיו"]] },
                { id: "cpi", label: "מוכנים להצמדה למדד?", type: "select", options: [["no","לא, בלי מדד"],["yes","כן, אם זה משתלם"]] }
            ]
        ];
        const answers = {};
        let step = 0;
        const fields = document.getElementById("fields");
        function render() {
            document.getElementById("progress").textContent = `שאלה ${step + 1} מתוך ${steps.length}`;
            fields.innerHTML = steps[step].map((field) => {
                if (field.type === "select") {
                    const opts = field.options.map(([v,l]) => `<option value="${v}">${l}</option>`).join("");
                    return `<div><label>${field.label}</label><select name="${field.id}">${opts}</select></div>`;
                }
                return `<div><label>${field.label}</label><input name="${field.id}" type="number" min="0"></div>`;
            }).join("");
            document.getElementById("back").style.visibility = step === 0 ? "hidden" : "visible";
        }
        function collect() {
            fields.querySelectorAll("input,select").forEach((el) => { answers[el.name] = el.value; });
        }
        document.getElementById("next").onclick = () => {
            collect();
            if (step < steps.length - 1) { step += 1; render(); return; }
            const mix = Habona.recommendMix(answers);
            document.getElementById("quiz").classList.add("hidden");
            const box = document.getElementById("result");
            box.classList.remove("hidden");
            box.innerHTML = `
                <div class="kpis">
                    <div class="kpi navy"><div class="label">החזר חודשי</div><div class="value">${Habona.money(mix.payment)}</div></div>
                    <div class="kpi"><div class="label">סכום משכנתא</div><div class="value">${Habona.money(mix.loan)}</div></div>
                    <div class="kpi"><div class="label">יחס החזר</div><div class="value">${mix.pti.toFixed(0)}%</div></div>
                </div>
                <div class="panel">
                    ${mix.tracks.map((track) => `<div class="mix-row"><strong>${track.name} · ${track.share}%</strong><div class="muted">${Habona.money(track.amount)} · ${Habona.pct(track.rate)} · ${track.note}</div><div class="bar"><span style="width:${track.share}%"></span></div></div>`).join("")}
                </div>
            `;
        };
        document.getElementById("back").onclick = () => { collect(); step = Math.max(0, step - 1); render(); };
        render();
    </script>
</body>
</html>
