<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח בקרה — משכנתא חכמה</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div class="shell" id="shell">
        <main class="content">
            <div class="page-head">
                <h1>לוח בקרה</h1>
                <p>מקירה כללית של המשכנתאות שלך</p>
            </div>
            <div class="kpis" id="kpis"></div>
            <div class="two">
                <a class="panel" href="/supervise.html">
                    <div class="icon-box">📈</div>
                    <h2>מפקח משכנתא</h2>
                    <p>עקוב אחר המשכנתא שלך, קבל ניתוח AI והמלצות לחיסכון</p>
                    <span class="go">כניסה למעקב ←</span>
                </a>
                <a class="panel navy" href="/plan.html">
                    <div class="icon-box">🧮</div>
                    <h2>יועץ תמהיל משכנתא</h2>
                    <p>קבל תמהיל משכנתא מותאם אישית באמצעות AI</p>
                    <span class="go">התחלת שאלון ←</span>
                </a>
            </div>
            <div class="two" id="loans"></div>
        </main>
    </div>
    <script src="/js/habona.js"></script>
    <script src="/js/shell.js"></script>
    <script>
        mountShell("home");
        const db = Habona.loadDb();
        const all = db.mortgages || [];
        const sumPay = all.reduce((s, m) => s + Habona.totals(m).payment, 0);
        const sumLeft = all.reduce((s, m) => s + Habona.totals(m).remaining, 0);
        document.getElementById("kpis").innerHTML = `
            <div class="kpi navy"><div class="label">תשלום חודשי</div><div class="value">${Habona.money(sumPay)}</div></div>
            <div class="kpi"><div class="label">יתרה כוללת</div><div class="value">${Habona.money(sumLeft)}</div></div>
            <div class="kpi"><div class="label">משכנתאות פעילים</div><div class="value">${all.length}</div></div>
        `;
        const mine = all.length ? all.map((m) => {
            const t = Habona.totals(m);
            return `<a class="loan-row" href="/mortgage.html?id=${m.id}">
                <div>
                    <strong>${m.bank}</strong>
                    <div class="muted">${t.trackCount} מסלולים · ${m.years || ""} שנה</div>
                </div>
            </a>`;
        }).join("") : `<div class="loan-row"><span class="muted">עדיין לא הוזנה משכנתא</span></div>`;
        document.getElementById("loans").innerHTML = `
            <div>
                <div class="section-title">המשכנתאות שלי</div>
                ${mine}
            </div>
            <div>
                <div class="section-title">כל המשכנתאות</div>
                <div class="loan-row">
                    <div>
                        <strong>${Habona.money(sumLeft)}</strong>
                        <div class="muted">${Habona.money(sumPay)} / חודש</div>
                    </div>
                </div>
            </div>
        `;
    </script>
</body>
</html>
