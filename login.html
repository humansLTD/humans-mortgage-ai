<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כניסה למערכת — משכנתא חכמה</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #1b3a57;
            --navy-deep: #16324c;
            --muted: #6b7784;
            --beige: #ead6c6;
            --page: #f7f3ef;
            --line: #e7e1db;
            --danger: #b42318;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Heebo', sans-serif;
            background: var(--page);
            color: var(--navy);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 28px 20px 48px;
        }

        .back {
            align-self: flex-start;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 28px;
        }

        .back:hover { color: var(--navy); }

        .mark {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: var(--navy);
            color: #fff;
            display: grid;
            place-items: center;
            margin: 8px auto 18px;
        }

        h1 {
            text-align: center;
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }

        .sub {
            text-align: center;
            color: var(--muted);
            font-size: 16px;
            margin-bottom: 28px;
        }

        .card {
            width: min(460px, 100%);
            background: #fff;
            border: 1px solid #efeae4;
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 10px 30px rgba(27, 58, 87, 0.04);
        }

        .socials {
            display: grid;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            border: 0;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: transform .15s ease, background .15s ease;
        }

        .btn:hover { transform: translateY(-1px); }
        .btn:disabled { opacity: 0.65; cursor: wait; transform: none; }

        .btn-social {
            background: #fff;
            border: 1.5px solid var(--line);
            color: var(--navy);
            border-radius: 999px;
            padding: 13px 16px;
            font-size: 15px;
        }

        .btn-social:hover { background: #faf7f4; }

        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            color: #9aa4ae;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.04em;
            margin: 22px 0;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--line);
        }

        .field { margin-bottom: 16px; }

        .field-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 12px;
        }

        label {
            font-size: 14px;
            font-weight: 700;
        }

        .linkish {
            background: none;
            border: 0;
            color: var(--muted);
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
        }

        .linkish:hover { color: var(--navy); }

        .input {
            position: relative;
        }

        .input svg {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8b97a3;
            pointer-events: none;
        }

        input[type="email"],
        input[type="password"],
        input[type="tel"],
        input[type="text"] {
            width: 100%;
            border: 1.5px solid var(--line);
            border-radius: 14px;
            padding: 13px 44px 13px 14px;
            font-family: inherit;
            font-size: 15px;
            color: var(--navy);
            background: #fff;
            outline: none;
        }

        input::placeholder { color: #b0bac3; }

        input:focus { border-color: var(--navy); }

        .error {
            display: none;
            color: var(--danger);
            font-size: 13px;
            margin-top: 8px;
        }

        .error.show { display: block; }

        .btn-navy {
            background: var(--navy);
            color: #fff;
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 16px;
            margin-top: 8px;
        }

        .btn-navy:hover { background: var(--navy-deep); }

        .switch {
            text-align: center;
            margin-top: 22px;
            color: var(--muted);
            font-size: 14.5px;
        }

        .switch a, .switch button {
            color: var(--navy);
            font-weight: 700;
            background: none;
            border: 0;
            font-family: inherit;
            font-size: inherit;
            cursor: pointer;
            text-decoration: none;
        }

        .hidden { display: none; }

        .phone-copy {
            color: var(--muted);
            font-size: 16px;
            line-height: 1.7;
            text-align: center;
            margin-bottom: 22px;
        }

        @media (max-width: 520px) {
            h1 { font-size: 28px; }
            .card { padding: 22px 18px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <a class="back" href="/">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
            חזרה לדף הבית
        </a>

        <div class="mark" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/>
                <path d="M10 17l5-5-5-5"/>
                <path d="M15 12H3"/>
            </svg>
        </div>

        <section id="auth-panel">
            <h1 id="auth-title">ברוכים השבים</h1>
            <p class="sub" id="auth-sub">התחברו לחשבון שלכם</p>

            <div class="card">
                <div class="socials">
                    <button class="btn btn-social" type="button" data-provider="google">
                        המשך עם Google
                        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5c-.3 1.5-1.2 2.8-2.5 3.6v3h4c2.4-2.2 3.5-5.4 3.5-8.7z"/>
                            <path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-4-3c-1.1.7-2.5 1.2-3.9 1.2-3 0-5.6-2-6.5-4.8H1.4v3.1C3.4 21.4 7.4 24 12 24z"/>
                            <path fill="#FBBC05" d="M5.5 14.5c-.2-.7-.4-1.4-.4-2.1s.1-1.4.4-2.1V7.2H1.4C.5 8.9 0 10.4 0 12.4s.5 3.5 1.4 5.2l4.1-3.1z"/>
                            <path fill="#EA4335" d="M12 4.8c1.7 0 3.3.6 4.5 1.7l3.4-3.4C17.9 1.1 15.2 0 12 0 7.4 0 3.4 2.6 1.4 6.6l4.1 3.1C6.4 6.8 9 4.8 12 4.8z"/>
                        </svg>
                    </button>
                    <button class="btn btn-social" type="button" data-provider="apple">
                        המשך עם Apple
                        <svg width="16" height="18" viewBox="0 0 16 20" aria-hidden="true">
                            <path fill="currentColor" d="M13.2 10.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.9-3.5.9s-1.8-.8-3-.8c-1.6 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.3 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7 2-.1 2.9-2.2c1.1-1.1 1.5-2.2 1.5-2.3-.1 0-2.8-1.1-2.8-4.2zM10.8 3.7c.6-.8 1.1-1.9.9-3-1 .1-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.2-.5 2.9-1.4z"/>
                        </svg>
                    </button>
                </div>

                <div class="divider">או</div>

                <form id="auth-form" novalidate>
                    <div class="field">
                        <div class="field-head"><label for="email">אימייל</label></div>
                        <div class="input">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
                            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-head">
                            <label for="password">סיסמה</label>
                            <button class="linkish" type="button" id="forgot">שכחת סיסמה?</button>
                        </div>
                        <div class="input">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
                            <input id="password" name="password" type="password" autocomplete="current-password" required>
                        </div>
                    </div>

                    <div class="field hidden" id="confirm-wrap">
                        <div class="field-head"><label for="confirm">אימות סיסמה</label></div>
                        <div class="input">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
                            <input id="confirm" name="confirm" type="password" autocomplete="new-password">
                        </div>
                    </div>

                    <p class="error" id="auth-error"></p>
                    <button class="btn btn-navy" type="submit" id="auth-submit">כניסה</button>
                </form>
            </div>

            <p class="switch" id="auth-switch">
                אין לכם חשבון?
                <button type="button" id="to-signup">הרשמה</button>
            </p>
        </section>

        <section id="phone-panel" class="hidden">
            <h1>כמעט שם</h1>
            <p class="sub">רק פרט אחרון לפני שנמשיך</p>
            <div class="card">
                <p class="phone-copy">רק עוד פרט אחד קטן כדי שנשלח לך את ניתוח המשכנתא:</p>
                <form id="phone-form" novalidate>
                    <div class="field">
                        <div class="field-head"><label for="phone">מספר טלפון</label></div>
                        <div class="input">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.5 3h3l1.5 4-2 1.5a12 12 0 006 6L17 13l4 1.5v3A16 16 0 016.5 3z"/></svg>
                            <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="050-000-0000" required>
                        </div>
                    </div>
                    <p class="error" id="phone-error"></p>
                    <button class="btn btn-navy" type="submit">שמירה והמשך</button>
                </form>
            </div>
        </section>

        <section id="done-panel" class="hidden">
            <h1>החשבון מוכן</h1>
            <p class="sub">שמרנו את הפרטים. בשלב הבא נחבר את המערכת עצמה.</p>
            <div class="card">
                <a class="btn btn-navy" href="/" style="text-decoration:none;">חזרה לדף הבית</a>
            </div>
        </section>
    </div>

    <script src="auth-config.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js" async></script>
    <script>
        const authPanel = document.getElementById('auth-panel');
        const phonePanel = document.getElementById('phone-panel');
        const donePanel = document.getElementById('done-panel');
        const title = document.getElementById('auth-title');
        const sub = document.getElementById('auth-sub');
        const confirmWrap = document.getElementById('confirm-wrap');
        const confirmInput = document.getElementById('confirm');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('auth-submit');
        const switchEl = document.getElementById('auth-switch');
        const forgot = document.getElementById('forgot');
        const authError = document.getElementById('auth-error');
        const phoneError = document.getElementById('phone-error');

        let mode = new URLSearchParams(location.search).get('mode') === 'signup' ? 'signup' : 'login';

        function setMode(next) {
            mode = next;
            const signup = mode === 'signup';
            title.textContent = signup ? 'יצירת חשבון' : 'ברוכים השבים';
            sub.textContent = signup ? 'נרשמים ומתחילים לעקוב אחרי המשכנתא' : 'התחברו לחשבון שלכם';
            confirmWrap.classList.toggle('hidden', !signup);
            confirmInput.required = signup;
            passwordInput.autocomplete = signup ? 'new-password' : 'current-password';
            submitBtn.textContent = signup ? 'הרשמה' : 'כניסה';
            forgot.style.visibility = signup ? 'hidden' : 'visible';
            switchEl.innerHTML = signup
                ? 'כבר יש לכם חשבון? <button type="button" id="to-login">כניסה</button>'
                : 'אין לכם חשבון? <button type="button" id="to-signup">הרשמה</button>';
            switchEl.querySelector('button').addEventListener('click', () => setMode(signup ? 'login' : 'signup'));
            authError.classList.remove('show');
        }

        function showPhone() {
            authPanel.classList.add('hidden');
            phonePanel.classList.remove('hidden');
            document.getElementById('phone').focus();
        }

        function showError(el, message) {
            el.textContent = message;
            el.classList.toggle('show', Boolean(message));
        }

        setMode(mode);

        const config = window.AUTH_CONFIG || {};
        const googleBtn = document.querySelector('[data-provider="google"]');
        const appleBtn = document.querySelector('[data-provider="apple"]');

        function waitFor(check, timeoutMs) {
            return new Promise((resolve, reject) => {
                if (check()) return resolve();
                const started = Date.now();
                const timer = setInterval(() => {
                    if (check()) {
                        clearInterval(timer);
                        resolve();
                    } else if (Date.now() - started > timeoutMs) {
                        clearInterval(timer);
                        reject(new Error('timeout'));
                    }
                }, 40);
            });
        }

        function finishSocialLogin(provider, profile) {
            sessionStorage.setItem('authProvider', provider);
            if (profile.email) sessionStorage.setItem('authEmail', profile.email);
            if (profile.name) sessionStorage.setItem('authName', profile.name);
            showPhone();
        }

        async function signInWithGoogle() {
            const clientId = (config.googleClientId || '').trim();
            if (!clientId) {
                showError(authError, 'חסר Google Client ID. הדביקו אותו בקובץ auth-config.js אחרי יצירת OAuth Client מסוג Web ב-Google Cloud.');
                return;
            }
            if (!location.protocol.startsWith('http')) {
                showError(authError, 'כניסה עם Google עובדת רק דרך כתובת http/https, לא מקובץ מקומי.');
                return;
            }

            showError(authError, '');
            googleBtn.disabled = true;
            try {
                await waitFor(() => window.google && google.accounts && google.accounts.oauth2, 8000);
                await new Promise((resolve, reject) => {
                    const tokenClient = google.accounts.oauth2.initTokenClient({
                        client_id: clientId,
                        scope: 'openid email profile',
                        callback: async (response) => {
                            if (!response || response.error) {
                                reject(new Error(response && response.error === 'popup_closed_by_user'
                                    ? 'canceled'
                                    : (response && response.error) || 'google_error'));
                                return;
                            }
                            try {
                                const userRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                                    headers: { Authorization: 'Bearer ' + response.access_token }
                                });
                                if (!userRes.ok) throw new Error('profile');
                                const profile = await userRes.json();
                                finishSocialLogin('google', {
                                    email: profile.email,
                                    name: profile.name
                                });
                                resolve();
                            } catch (err) {
                                reject(err);
                            }
                        },
                        error_callback: (err) => {
                            const type = err && err.type;
                            reject(new Error(type === 'popup_closed' ? 'canceled' : 'google_error'));
                        }
                    });
                    tokenClient.requestAccessToken({ prompt: 'select_account' });
                });
            } catch (err) {
                if (err && err.message === 'canceled') {
                    showError(authError, 'בחירת החשבון בגוגל בוטלה. אפשר לנסות שוב.');
                } else if (err && err.message === 'timeout') {
                    showError(authError, 'ספריית Google לא נטענה. בדקו את החיבור לאינטרנט ונסו שוב.');
                } else {
                    showError(authError, 'לא הצלחנו להתחבר עם Google. בדקו שה-Client ID והדומיין מורשים ב-Google Cloud.');
                }
            } finally {
                googleBtn.disabled = false;
            }
        }

        async function signInWithApple() {
            const clientId = (config.appleClientId || '').trim();
            const redirectURI = (config.appleRedirectURI || (location.origin + location.pathname)).trim();
            if (!clientId) {
                showError(authError, 'חסר Apple Service ID. הדביקו אותו בקובץ auth-config.js אחרי הגדרת Sign in with Apple.');
                return;
            }
            if (!location.protocol.startsWith('http')) {
                showError(authError, 'כניסה עם Apple עובדת רק דרך כתובת http/https, לא מקובץ מקומי.');
                return;
            }

            showError(authError, '');
            appleBtn.disabled = true;
            try {
                await waitFor(() => window.AppleID && AppleID.auth, 8000);
                AppleID.auth.init({
                    clientId: clientId,
                    scope: 'name email',
                    redirectURI: redirectURI,
                    usePopup: true
                });
                const data = await AppleID.auth.signIn();
                const email = data && data.user && data.user.email;
                const nameParts = data && data.user && data.user.name;
                const name = nameParts ? [nameParts.firstName, nameParts.lastName].filter(Boolean).join(' ') : '';
                finishSocialLogin('apple', { email: email || '', name: name });
            } catch (err) {
                const canceled = err && (err.error === 'popup_closed_by_user' || err.error === 'user_cancelled_authorize');
                if (canceled) {
                    showError(authError, 'הכניסה עם Apple בוטלה. אפשר לנסות שוב.');
                } else if (err && err.message === 'timeout') {
                    showError(authError, 'ספריית Apple לא נטענה. בדקו את החיבור לאינטרנט ונסו שוב.');
                } else {
                    showError(authError, 'לא הצלחנו להתחבר עם Apple. בדקו את מזהה השירות וכתובת ה-Return URL אצל Apple.');
                }
            } finally {
                appleBtn.disabled = false;
            }
        }

        googleBtn.addEventListener('click', signInWithGoogle);
        appleBtn.addEventListener('click', signInWithApple);

        document.getElementById('auth-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = passwordInput.value;
            const confirm = confirmInput.value;

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showError(authError, 'נא להזין כתובת אימייל תקינה.');
                return;
            }
            if (password.length < 6) {
                showError(authError, 'הסיסמה צריכה להיות באורך 6 תווים לפחות.');
                return;
            }
            if (mode === 'signup' && password !== confirm) {
                showError(authError, 'אימות הסיסמה אינו תואם.');
                return;
            }
            sessionStorage.setItem('authEmail', email);
            showPhone();
        });

        forgot.addEventListener('click', () => {
            showError(authError, 'בשלב הדמו אין איפוס סיסמה. אפשר להמשיך עם הרשמה מחדש.');
        });

        document.getElementById('phone-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone').value.replace(/[\s-]/g, '');
            if (!/^05\d{8}$/.test(phone)) {
                showError(phoneError, 'נא להזין מספר נייד ישראלי תקין, למשל 050-123-4567.');
                return;
            }
            sessionStorage.setItem('authPhone', phone);
            window.location.href = '/dashboard';
        });
    </script>
</body>
</html>
